      <h1>Dupe: every trend, starring you.</h1>
      <p>Dupe is an iPhone app that turns a few selfies of yourself into social-media-style photos, carousels and short videos of you, in trending scenes and styles. Coming soon to the App Store.</p>
      <h2>Safe by design</h2>
      <p>You can only make content of yourself, or of another adult who has clearly given you permission, and you must be 18 or over. Dupe does not allow nudity, sexual or intimate content, never allows photos of anyone under 18, and is not for making non-consensual intimate imagery (NCII) or deepfakes of other people. Photos and typed prompts are checked automatically, and every result can be reported in the app. Google services are used only for sign-in and for Gemini safety checks and prompt writing, never to create intimate imagery.</p>
